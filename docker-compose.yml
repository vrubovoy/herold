# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#   git submodule update --init
# schlussel runs from its own repo (see schlussel/docker-compose.yml) and
# must be on the same network for herold-backend to reach it by hostname.
#
# Neither service publishes a host port - both are reached through the
# tor gateway (see https://github.com/zudaR107/tor), which is the only
# container that binds to a host port. `herold-data` is given a fixed
# name so it's the same physical volume whether this compose file is run
# standalone or included from tor's.
services:
  herold-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3006
      DATABASE_PATH: /data/herold.db
      SCHLUSSEL_JWKS_URL: ${SCHLUSSEL_JWKS_URL:-http://schlussel:4000/.well-known/jwks.json}
      # Must match schlussel's own JWT_ISSUER (hardcoded to "schlussel" in
      # schlussel/docker-compose.yml).
      JWT_ISSUER: ${JWT_ISSUER:-schlussel}
      # Substitution var is HEROLD_ALLOWED_ORIGINS, not ALLOWED_ORIGINS -
      # when tor's docker-compose.yml includes this file alongside every
      # other service's, they'd otherwise all read the exact same outer
      # variable name, silently overriding each other. Container-internal
      # env var name is still plain ALLOWED_ORIGINS below - only the
      # outer name changed.
      ALLOWED_ORIGINS: ${HEROLD_ALLOWED_ORIGINS:-https://localhost,https://herold.localhost}
      # Encrypts stored IMAP/SMTP passwords at rest (lib/credentialCrypto.ts) -
      # required, not defaulted, same as the platform's HMAC secrets:
      # `openssl rand -base64 32`.
      HEROLD_CREDENTIAL_ENCRYPTION_KEY: ${HEROLD_CREDENTIAL_ENCRYPTION_KEY:?set HEROLD_CREDENTIAL_ENCRYPTION_KEY}
      # How often the background sync worker (sync/worker.ts) polls
      # every connected account's IMAP folders for new/changed messages.
      # Defaults to 3 minutes in code if unset - only listed here for
      # discoverability, not because a value is required.
      HEROLD_SYNC_INTERVAL_MS: ${HEROLD_SYNC_INTERVAL_MS:-180000}
      HEROLD_OUTBOUND_HOST_ALLOWLIST: ${HEROLD_OUTBOUND_HOST_ALLOWLIST:-}
      HEROLD_OUTBOUND_CIDR_ALLOWLIST: ${HEROLD_OUTBOUND_CIDR_ALLOWLIST:-}
      HEROLD_MAX_MESSAGE_TEXT_BYTES: ${HEROLD_MAX_MESSAGE_TEXT_BYTES:-262144}
      HEROLD_MAX_ACCOUNT_SYNC_BYTES: ${HEROLD_MAX_ACCOUNT_SYNC_BYTES:-26214400}
      HEROLD_MAX_ACCOUNT_SYNC_MESSAGES: ${HEROLD_MAX_ACCOUNT_SYNC_MESSAGES:-1000}
      HEROLD_MAX_ATTACHMENT_BYTES: ${HEROLD_MAX_ATTACHMENT_BYTES:-26214400}
    volumes:
      - herold-data:/data
    networks:
      - schloss-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  herold-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SCHLUSSEL_WEB_URL: ${SCHLUSSEL_WEB_URL:-https://auth.localhost}
      SCHLOSS_URL: ${SCHLOSS_URL:-https://localhost}
      GLOCKE_URL: ${GLOCKE_URL:-https://glocke.localhost}
    networks:
      - schloss-net
    depends_on:
      - herold-backend

volumes:
  herold-data:
    name: herold-data

networks:
  schloss-net:
    external: true
